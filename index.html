<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Single Page Application</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js"></script>
</head>
<body>
    <div id="app">
        <div id="login">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button>
        </div>
        <div id="dashboard" style="display:none;">
            <h2>Main Dashboard</h2>
            <div id="comments">
                <h3>Comments</h3>
                <div id="commentList"></div>
                <input type="text" id="commentInput" placeholder="Leave a comment...">
                <button id="commentBtn">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: 'YOUR_API_KEY',
            authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
            projectId: 'YOUR_PROJECT_ID',
            storageBucket: 'YOUR_PROJECT_ID.appspot.com',
            messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
            appId: 'YOUR_APP_ID'
        };
        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Login function
        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Successful login
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadComments();
                })
                .catch((error) => {
                    console.error(error);
                });
        };

        // Load comments function
        function loadComments() {
            db.collection('comments').get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    const comment = doc.data().text;
                    const div = document.createElement('div');
                    div.textContent = comment;
                    document.getElementById('commentList').appendChild(div);
                });
            });
        }

        // Submit comment
        document.getElementById('commentBtn').onclick = () => {
            const commentText = document.getElementById('commentInput').value;
            db.collection('comments').add({
                text: commentText
            }).then(() => {
                loadComments();
                document.getElementById('commentInput').value = '';
            });
        };
    </script>
</body>
</html>
